name: Build Widget APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Inject google-services.json (from encrypted secret)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          printf '%s' "$GS_B64" | tr -d '[:space:]' | base64 -d > app/google-services.json
          echo "google-services.json bytes: $(wc -c < app/google-services.json)"

      # 서명은 로컬에서 함(키를 클라우드에 올리지 않음) → 여기선 미서명 release 빌드
      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
